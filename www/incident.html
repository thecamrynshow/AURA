<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>PNEUOMA — Incident Detail</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#07080d">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="stylesheet" href="styles.css">
    <script src="jspdf.min.js"></script>
    <script src="jspdf-autotable.min.js"></script>
</head>
<body>
    <div id="top-nav"></div>

    <div class="page" id="app">
        <div id="content"></div>
    </div>

    <!-- Template Modal -->
    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2>Communication Templates</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-tabs" style="flex-wrap:wrap">
                <button class="modal-tab active" onclick="switchTab('teacher', this)">Teacher</button>
                <button class="modal-tab" onclick="switchTab('parent', this)">Parent</button>
                <button class="modal-tab" onclick="switchTab('counselor', this)">Counselor</button>
                <button class="modal-tab" onclick="switchTab('principal', this)">Principal</button>
                <button class="modal-tab" onclick="switchTab('dean', this)">Dean</button>
                <button class="modal-tab" onclick="switchTab('support', this)">Support Staff</button>
            </div>
            <div class="modal-content"><pre id="template-content">Loading...</pre></div>
            <div class="modal-actions">
                <button class="btn btn-dark btn-sm" style="flex:1" onclick="copyTemplate()">Copy to Clipboard</button>
                <button class="btn btn-primary btn-sm" style="width:auto" onclick="markSent()">Mark Sent</button>
            </div>
        </div>
    </div>

    <div id="bottom-nav"></div>

    <script src="app.js"></script>
    <script>
        document.getElementById('top-nav').innerHTML = topNav();
        document.getElementById('bottom-nav').innerHTML = bottomNav('');

        const incidentId = new URLSearchParams(window.location.search).get('id');
        let incident = null;
        let templates = null;
        let activeTab = 'teacher';

        async function loadIncident() {
            const el = document.getElementById('content');
            if (!incidentId) { el.innerHTML = renderEmpty('No incident specified', ''); return; }

            el.innerHTML = renderSpinner();

            try {
                incident = await api.get(`/api/incidents/${incidentId}`);
                renderDetail();
            } catch {
                el.innerHTML = renderEmpty('Incident not found', '<a href="incidents.html" style="color:var(--accent)">Back to incidents</a>');
            }
        }

        let showRealNames = false;

        function renderDetail() {
            const inc = incident;
            const rawStudents = normalizeStudents(inc.studentsInvolved);
            const studentLabels = rawStudents.map((s, i) => studentDisplayLabel(s, i));
            const staff = inc.staffInvolved || [];
            const witnesses = inc.witnesses || [];

            document.getElementById('content').innerHTML = `
                <div class="header-with-back">
                    <button class="back-btn" onclick="history.back()">${ICONS.chevronLeft}</button>
                    <div>
                        <h1 style="font-size:18px;font-weight:800">${escapeHtml(inc.incidentType)}</h1>
                        <p style="font-size:12px;color:var(--text-muted)">${formatDate(inc.date)} at ${escapeHtml(inc.time)}</p>
                    </div>
                </div>

                <div class="badges mb-16">
                    <span class="badge ${severityClass(inc.severity)}">${escapeHtml(inc.severity)}</span>
                    <span class="badge ${statusClass(inc.status)}">${escapeHtml(inc.status)}</span>
                </div>

                <div class="detail-card mb-16">
                    <div class="detail-field"><div class="label">Location</div><div class="value">${escapeHtml(inc.location)}</div></div>
                    <div class="detail-field"><div class="label">Description</div><div class="value">${escapeHtml(inc.description)}</div></div>
                    ${rawStudents.length ? `<div class="detail-field"><div class="label" style="display:flex;align-items:center;justify-content:space-between">Students Involved <a href="#" onclick="event.preventDefault();showRealNames=!showRealNames;renderDetail()" style="font-size:10px;font-weight:600;color:var(--accent);text-transform:none;letter-spacing:0">${showRealNames ? 'Hide Names' : 'Reveal Names'}</a></div><div class="value">${rawStudents.map((s, i) => {
                        const display = studentDisplayLabel(s, i);
                        const real = typeof s === 'string' ? s : s.realName;
                        const isAnon = display !== real;
                        return '<span class="tag tag-student" style="margin-right:4px">' + escapeHtml(display) + (showRealNames && isAnon ? ' <span style="font-size:10px;opacity:0.5">(' + escapeHtml(real) + ')</span>' : '') + '</span>';
                    }).join('')}</div></div>` : ''}
                    ${staff.length ? `<div class="detail-field"><div class="label">Staff Involved</div><div class="value">${staff.map(s => `<span class="tag tag-student" style="margin-right:4px">${escapeHtml(s)}</span>`).join('')}</div></div>` : ''}
                    ${witnesses.length ? `<div class="detail-field"><div class="label">Witnesses</div><div class="value">${witnesses.map(s => `<span class="tag tag-student" style="margin-right:4px">${escapeHtml(s)}</span>`).join('')}</div></div>` : ''}
                    ${inc.immediateAction ? `<div class="detail-field"><div class="label">Immediate Action</div><div class="value">${escapeHtml(inc.immediateAction)}</div></div>` : ''}
                    ${(inc.deescalationStrategy||[]).length ? `<div class="detail-field"><div class="label">De-Escalation Strategy</div><div class="value">${inc.deescalationStrategy.map(s => '<span class="badge badge-open" style="margin-right:4px;margin-bottom:4px;display:inline-block">' + escapeHtml(s) + '</span>').join('')}</div></div>` : ''}
                    ${inc.followUpNeeded ? `<div class="detail-field"><div class="label">Follow-Up Needed</div><div class="value">${escapeHtml(inc.followUpNeeded)}</div></div>` : ''}
                    ${inc.notes ? `<div class="detail-field"><div class="label">Notes</div><div class="value">${escapeHtml(inc.notes)}</div></div>` : ''}
                    <div class="detail-field"><div class="label">Reported By</div><div class="value">${escapeHtml(inc.reportedBy)}</div></div>
                    ${inc.rawTranscript ? `<div class="detail-field"><div class="label">Voice Transcript</div><div class="value" style="font-style:italic;color:var(--text-muted)">"${escapeHtml(inc.rawTranscript)}"</div></div>` : ''}
                </div>

                <div class="detail-card mb-16" style="padding:14px 16px">
                    <div class="label" style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">Communications</div>
                    <div class="comms-status">
                        <div class="comm-row"><div class="comm-dot ${inc.teacherNotified ? 'done' : 'pending'}"></div><span style="color:${inc.teacherNotified ? 'var(--accent-green)' : 'var(--text-muted)'}">Teacher Notified</span></div>
                        <div class="comm-row"><div class="comm-dot ${inc.parentNotified ? 'done' : 'pending'}"></div><span style="color:${inc.parentNotified ? 'var(--accent-green)' : 'var(--text-muted)'}">Parent Notified</span></div>
                        <div class="comm-row"><div class="comm-dot ${inc.counselorNotified ? 'done' : 'pending'}"></div><span style="color:${inc.counselorNotified ? 'var(--accent-green)' : 'var(--text-muted)'}">Counselor Notified</span></div>
                        <div class="comm-row"><div class="comm-dot ${inc.principalNotified ? 'done' : 'pending'}"></div><span style="color:${inc.principalNotified ? 'var(--accent-green)' : 'var(--text-muted)'}">Principal Notified</span></div>
                        <div class="comm-row"><div class="comm-dot ${inc.deanNotified ? 'done' : 'pending'}"></div><span style="color:${inc.deanNotified ? 'var(--accent-green)' : 'var(--text-muted)'}">Dean Notified</span></div>
                        <div class="comm-row"><div class="comm-dot ${inc.supportStaffNotified ? 'done' : 'pending'}"></div><span style="color:${inc.supportStaffNotified ? 'var(--accent-green)' : 'var(--text-muted)'}">Support Staff Notified</span></div>
                    </div>
                </div>

                <button class="btn btn-amber mb-16" id="gen-btn" onclick="generateTemplates()">Generate Communication Templates</button>
                <div id="template-error"></div>

                <div class="btn-row mb-16">
                    <button class="btn btn-dark btn-sm" onclick="copySIS()">Copy for SIS</button>
                    <button class="btn btn-dark btn-sm" onclick="downloadPDF()">Download PDF</button>
                </div>

                <div class="btn-row">
                    <button class="btn btn-dark btn-sm" onclick="updateStatus()">Update Status</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteIncident()">Delete</button>
                </div>
            `;
        }

        // ==================== TEMPLATES ====================
        async function generateTemplates() {
            const btn = document.getElementById('gen-btn');
            btn.disabled = true;
            btn.textContent = 'Generating...';
            document.getElementById('template-error').innerHTML = '';

            try {
                const templateData = { ...incident, studentsInvolved: studentsForDisplay(incident.studentsInvolved) };
                templates = await api.post('/api/incidents/templates', templateData);
                activeTab = 'teacher';
                showModal();
            } catch (err) {
                document.getElementById('template-error').innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generate Communication Templates';
            }
        }

        function showModal() {
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('template-content').textContent = templates.teacherEmail || 'No template generated.';
            document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.modal-tab').classList.add('active');
        }

        function closeModal(e) {
            if (!e || e.target === document.getElementById('modal-overlay')) {
                document.getElementById('modal-overlay').classList.add('hidden');
            }
        }

        const TAB_MAP = {
            teacher: 'teacherEmail',
            parent: 'parentEmail',
            counselor: 'counselorReferral',
            principal: 'principalBriefing',
            dean: 'deanNotification',
            support: 'supportStaffMemo'
        };

        const NOTIFY_MAP = {
            teacher: 'teacherNotified',
            parent: 'parentNotified',
            counselor: 'counselorNotified',
            principal: 'principalNotified',
            dean: 'deanNotified',
            support: 'supportStaffNotified'
        };

        function switchTab(tab, el) {
            activeTab = tab;
            document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('template-content').textContent = templates[TAB_MAP[tab]] || 'No template generated.';
        }

        async function copyTemplate() {
            await navigator.clipboard.writeText(templates[TAB_MAP[activeTab]] || '');
            const btn = document.querySelector('.modal-actions .btn-dark');
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = 'Copy to Clipboard', 1500);
        }

        async function markSent() {
            try {
                incident = await api.put(`/api/incidents/${incidentId}`, { [NOTIFY_MAP[activeTab]]: true });
                renderDetail();
                closeModal();
            } catch {}
        }

        // ==================== EXPORT ====================
        async function copySIS() {
            await navigator.clipboard.writeText(generateClipboardText(incident));
            alert('Copied to clipboard! Paste into your SIS software.');
        }

        function downloadPDF() {
            try {
                if (!window.jspdf) {
                    alert('PDF library is still loading. Please wait a moment and try again.');
                    return;
                }
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const inc = incident;

                doc.setFillColor(15, 23, 42);
                doc.rect(0, 0, 210, 32, 'F');
                doc.setFillColor(245, 158, 11);
                doc.rect(0, 32, 210, 2, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(8);
                doc.text('PNEUOMA INCIDENT CAPTURE & CONTAINMENT SYSTEM', 14, 10);
                doc.setFontSize(16);
                doc.setFont('helvetica', 'bold');
                doc.text('Incident Report', 14, 22);
                doc.setFontSize(9);
                doc.setFont('helvetica', 'normal');
                doc.text('ID: ' + inc.id.substring(0,8) + '... | ' + formatDate(inc.date) + ' ' + inc.time, 14, 29);

                doc.setTextColor(0, 0, 0);

                let y = 40;

                if (typeof doc.autoTable === 'function') {
                    doc.autoTable({
                        startY: 40,
                        body: [
                            ['Date', formatDate(inc.date), 'Time', inc.time],
                            ['Location', inc.location, 'Type', inc.incidentType || ''],
                            ['Severity', inc.severity, 'Status', (inc.status || '').toUpperCase()],
                            ['Reported By', inc.reportedBy || '', '', ''],
                        ],
                        theme: 'plain',
                        styles: { fontSize: 9, cellPadding: 3 },
                        columnStyles: { 0: { fontStyle: 'bold', cellWidth: 30 }, 2: { fontStyle: 'bold', cellWidth: 30 } },
                    });
                    y = (doc.lastAutoTable ? doc.lastAutoTable.finalY : doc.previousAutoTable ? doc.previousAutoTable.finalY : 80) + 10;
                } else {
                    doc.setFontSize(9);
                    const fields = [
                        'Date: ' + formatDate(inc.date) + '    Time: ' + inc.time,
                        'Location: ' + inc.location + '    Type: ' + (inc.incidentType || ''),
                        'Severity: ' + inc.severity + '    Status: ' + (inc.status || '').toUpperCase(),
                        'Reported By: ' + (inc.reportedBy || ''),
                    ];
                    fields.forEach(f => { doc.text(f, 14, y); y += 6; });
                    y += 4;
                }

                const addSection = (title, content) => {
                    if (!content) return;
                    if (y > 260) { doc.addPage(); y = 20; }
                    doc.setFontSize(10);
                    doc.setFont('helvetica', 'bold');
                    doc.setTextColor(0, 0, 0);
                    doc.text(title, 14, y); y += 5;
                    doc.setFontSize(9);
                    doc.setFont('helvetica', 'normal');
                    const lines = doc.splitTextToSize(String(content), 182);
                    doc.text(lines, 14, y); y += lines.length * 4 + 6;
                };

                if ((inc.studentsInvolved||[]).length) addSection('Students Involved', studentsForDisplay(inc.studentsInvolved).join(', '));
                if ((inc.staffInvolved||[]).length) addSection('Staff Involved', inc.staffInvolved.join(', '));
                if ((inc.witnesses||[]).length) addSection('Witnesses', inc.witnesses.join(', '));
                addSection('Description', inc.description);
                addSection('Immediate Action', inc.immediateAction);
                if ((inc.deescalationStrategy||[]).length) addSection('De-Escalation Strategy', inc.deescalationStrategy.join(', '));
                addSection('Follow-Up Required', inc.followUpNeeded);
                if (inc.notes) addSection('Notes', inc.notes);

                const pageCount = doc.getNumberOfPages();
                for (let i = 1; i <= pageCount; i++) {
                    doc.setPage(i);
                    doc.setFontSize(7);
                    doc.setTextColor(150, 150, 150);
                    doc.text('CONFIDENTIAL — Page ' + i + ' of ' + pageCount, 105, 290, { align: 'center' });
                }

                doc.save('incident-' + inc.id.substring(0,8) + '.pdf');
            } catch (err) {
                console.error('PDF generation error:', err);
                alert('PDF export failed: ' + err.message);
            }
        }

        // ==================== ACTIONS ====================
        function updateStatus() {
            const current = incident.status;
            const options = STATUS_OPTIONS.filter(s => s !== current);

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.onclick = () => overlay.remove();
            overlay.innerHTML = '<div class="modal" onclick="event.stopPropagation()" style="padding:20px;max-width:340px">' +
                '<h2 style="font-size:16px;font-weight:700;margin-bottom:4px">Update Status</h2>' +
                '<p style="font-size:12px;color:var(--text-muted);margin-bottom:16px">Current: ' + current + '</p>' +
                '<div style="display:flex;flex-direction:column;gap:8px">' +
                options.map(s =>
                    '<button class="btn btn-dark btn-sm" style="text-transform:capitalize" data-status="' + s + '">' + s + '</button>'
                ).join('') +
                '</div>' +
                '<button class="btn btn-dark btn-sm" style="margin-top:12px;opacity:0.5" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>' +
                '</div>';

            document.body.appendChild(overlay);

            overlay.querySelectorAll('[data-status]').forEach(btn => {
                btn.onclick = async () => {
                    const next = btn.dataset.status;
                    btn.disabled = true;
                    btn.textContent = 'Updating...';
                    try {
                        incident = await api.put('/api/incidents/' + incidentId, { status: next });
                        overlay.remove();
                        renderDetail();
                    } catch (err) {
                        alert('Failed to update: ' + err.message);
                        overlay.remove();
                    }
                };
            });
        }

        async function deleteIncident() {
            if (!confirm('Delete this incident? This cannot be undone.')) return;
            try {
                await api.del(`/api/incidents/${incidentId}`);
                window.location.href = 'incidents.html';
            } catch (err) {
                alert('Failed to delete: ' + err.message);
            }
        }

        loadIncident();
    </script>
</body>
</html>

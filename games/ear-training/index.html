<head>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TQGSNCV7Q2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-TQGSNCV7Q2');

    <script src="/auth/protect.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ear Training — Music Regulation | PNEUOMA</title>
    <meta name="robots" content="index, follow">

<body>
    <noscript>This game needs JavaScript enabled.</noscript>
    <div style="padding: 1.25rem; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;">
        Redirecting to Ear Training…
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search || '');
            const grade = params.get('grade_band') || params.get('music_grade_band') || 'all';
            const earMode = params.get('music_ear_mode') || params.get('ear_mode') || '';

            const q = [
                'music_context=ear-training',
                'grade_band=' + encodeURIComponent(grade)
            ];
            if (earMode) q.push('music_ear_mode=' + encodeURIComponent(earMode));

            const target = '/games/solfege/?' + q.join('&');
            window.location.replace(target);
        })();
    </script>
</body>

    <meta charset="UTF-8">

    <title>Rhythm Regulation — Music Regulation | PNEUOMA</title>

<body>
    <noscript>This game needs JavaScript enabled.</noscript>
    <div style="padding: 1.25rem; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;">
        Redirecting to Rhythm Regulation…
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search || '');
            const grade = params.get('grade_band') || params.get('music_grade_band') || 'all';
            const mode =
                params.get('regulation_mode') ||
                params.get('regulationMode') ||
                'match';

            const target = '/games/pulse/?' + [
                'music_context=rhythm-regulation',
                'grade_band=' + encodeURIComponent(grade),
                'regulation_mode=' + encodeURIComponent(mode)
            ].join('&');

            window.location.replace(target);
        })();
    </script>
</body>

name: Regenerate sitemap

# Keeps sitemap.xml in sync with the file tree so it never goes stale.
# Runs on every push to main that touches pages, plus a weekly refresh
# so <lastmod> dates stay current even without page changes.

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/generate-sitemap.js'
      - '.github/workflows/sitemap.yml'
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sitemap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for accurate lastmod)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate sitemap
        run: node scripts/generate-sitemap.js

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain sitemap.xml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore(seo): regenerate sitemap.xml [skip ci]"
            git push
          else
            echo "sitemap.xml already up to date."
          fi
